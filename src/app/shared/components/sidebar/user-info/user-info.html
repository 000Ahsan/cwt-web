<div class="sidebar-user text-center" *ngIf="user">
  <img class="img-90 rounded-circle" src="assets/images/user/7.jpg" alt="">
  <div class="badge-bottom"><span class="badge badge-primary">{{ user.role }}</span></div>
  <a href="javascript:void(0)">
    <h6 class="mt-3 f-14 f-w-600">{{ user.firstName }} {{ user.lastName }}</h6>
  </a>
  <p class="mb-0 font-roboto">{{ user.email }}</p>
</div>
