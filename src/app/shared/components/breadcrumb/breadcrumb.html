<div class="container-fluid">
  <div class="page-header">
    <div class="row">
      <div class="col-sm-6">
        <h3>{{title}}</h3>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a [routerLink]="'/dashboard/default'">Home</a></li>
          @if (breadcrumbs?.parentBreadcrumb) {
          <li class="breadcrumb-item">{{breadcrumbs?.parentBreadcrumb}}</li>
          } @if (breadcrumbs?.childBreadcrumb) {
          <li class="breadcrumb-item active">{{breadcrumbs?.childBreadcrumb}}</li>
          }
        </ol>
      </div>
      <div class="col-sm-6">
        <app-bookmark />
      </div>
    </div>
  </div>
</div>
