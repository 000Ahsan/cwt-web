<div class="card income-card">
  <div class="card-header">
    <div class="header-top d-sm-flex align-items-center">
      <h5>Sales overview</h5>
      <div class="center-content">
        <p class="d-sm-flex align-items-center">
          <span class="font-primary m-r-10 f-w-700">$859.25k</span
          ><i class="toprightarrow-primary fa fa-arrow-up m-r-10"></i>86% More than last year
        </p>
      </div>
    </div>
  </div>
  <div class="card-body p-0">
    <div id="chart-timeline-dashbord">
      <apx-chart
        [chart]="sales.chart"
        [dataLabels]="sales.dataLabels"
        [series]="sales.series"
        [colors]="sales.colors"
        [xaxis]="sales.xaxis"
        [tooltip]="sales.tooltip"
        [markers]="sales.markers"
        [annotations]="sales.annotations"
        [responsive]="sales.responsive"
      />
    </div>
  </div>
</div>
