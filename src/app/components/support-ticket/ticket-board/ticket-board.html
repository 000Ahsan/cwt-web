<div class="row">
 @for (ticket of ticketListStatus; track ticket) {
    <div class="col-xl-4 col-sm-6 box-col-4">
       <div class="card ecommerce-widget pro-gress">
          <div class="card-body support-ticket-font">
             <div class="row">
                <div class="col-5">
                   <h6>{{ticket.statusTitle}}</h6>
                   <h3 class="total-num counter">{{ticket.order}}</h3>
                </div>
                <div class="col-7">
                   <div class="text-end">
                      <ul>
                         <li>Profit<span class="product-stts txt-success ms-2">{{ticket.profit}}<i
                                  class="icon-angle-up f-12 ms-1"></i></span></li>
                         <li>Loss<span class="product-stts txt-danger ms-2">{{ticket.loss}}<i
                                  class="icon-angle-down f-12 ms-1"></i></span></li>
                      </ul>
                   </div>
                </div>
             </div>
             <div class="progress-showcase">
                <div class="progress sm-progress-bar">
                   <div class="progress-bar bg-{{ticket.lavalColor}}" role="progressbar"
                      [style.width]="ticket.laval" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
                   </div>
                </div>
             </div>
          </div>
       </div>
    </div>
 }
</div>
