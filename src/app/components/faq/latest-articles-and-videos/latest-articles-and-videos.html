<div class="header-faq">
  <h3 class="mb-0">Latest articles and videos</h3>
</div>
<div class="row">
  @for (allData of articlesAndVideos; track allData) {
    <div class="col-xl-4" [class]="allData.class">
      <div class="row">
        @for (data of allData.data; track data) {
        <div [class]="data.class">
          <div class="card">
            <div class="card-body">
              <div class="media">
                <span class="m-r-30">
                  <app-feather-icons [icon]="data.icon" />
                </span>
                <div class="media-body">
                  <h6 class="f-w-600">{{data.title}}</h6>
                  <p>{{data.desc}}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      }
      </div>
    </div>
  }
</div>
