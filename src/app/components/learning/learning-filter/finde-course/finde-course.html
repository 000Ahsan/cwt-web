<div class="card">
  <div class="card-header">
    <h5 class="mb-0 p-0">
      <button class="btn btn-link" (click)="collapse.toggle()" [attr.aria-expanded]="!isCollapsed"
        aria-controls="collapseExample">Find Course</button>
    </h5>
  </div>
  <div class="collapse show" #collapse="ngbCollapse" [(ngbCollapse)]="isCollapsed">
    <div class="card-body filter-cards-view animate-chk">
      <div class="job-filter">
        <div class="faq-form">
          <input class="form-control" type="text" placeholder="Search.."><app-feather-icons class="search-icon"
            [icon]="'search'" />
        </div>
      </div>
      @for (find of findCourse; track find) {
      <div class="checkbox-animated">
        <div class="learning-header">
          <h5 class="f-w-600">{{find.title}}</h5>
        </div>
          @for (l of find.chack; track l) {
          <label class="d-block" for="{{l.chackId}}">
            <input class="{{find.type}}_animated" id="{{l.chackId}}" type="{{find.type}}"  name="rdo-ani"> {{l.chackTitle}}
          </label>
          }
      </div>
      }
      <button class="btn btn-primary text-center" type="button">Filter</button>
    </div>
  </div>
</div>
