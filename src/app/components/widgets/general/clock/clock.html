<div class="card">
  <div class="mobile-clock-widget">
    <div class="bg-svg">
      <svg-icon src="assets/images/svg/widgets/clock.svg" />
    </div>
    <div>
      <ul class="clock">
        <li class="hour" [style.transform]="hourRotation"></li>
        <li class="min" [style.transform]="minRotation"></li>
        <li class="sec" [style.transform]="secRotation"></li>
      </ul>

      <div class="date f-24 mb-2">{{ today | date: 'fullDate' }}</div>
      <div>
        <p class="m-0 f-14 text-light">Kolkata, India</p>
      </div>
    </div>
  </div>
</div>
