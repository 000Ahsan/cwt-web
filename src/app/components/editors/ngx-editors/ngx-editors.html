<div class="container-fluid">
    <div class="row">
        <div class="col-sm-12">
            <div class="card">
                <div class="card-header pb-0">
                    <h5>Ngx Editors</h5>
                </div>
                <div class="card-body">
                    <div class="NgxEditor__Wrapper">
                        <ngx-editor-menu [editor]="editor" />
                        <ngx-editor [editor]="editor" [ngModel]="html" [disabled]="false" [placeholder]="'Type here...'" />
                      </div>
                </div>
            </div>
        </div>
    </div>
</div>
