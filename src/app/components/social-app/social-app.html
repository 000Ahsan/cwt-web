<div class="container-fluid">
  <div class="user-profile social-app-profile">
    <div class="row"> 
      <div class="col-sm-12">
        <app-user-profile />
      </div>
      <!--  user profile first-style start-->
      <div class="col-sm-12 box-col-12">
        <div class="card">                            
          <div class="social-tab">
            <ul class="nav nav-tabs" id="top-tab" role="tablist">
              <li class="nav-item"><a class="nav-link active" role="tab" [ngClass]="{'active show': openTab === 'timeline'}" (click)="tabbed('timeline')"><app-feather-icons [icon]="'clock'" />Timeline</a></li>
              <li class="nav-item"><a class="nav-link" role="tab" [ngClass]="{'active show': openTab === 'about'}" (click)="tabbed('about')"><app-feather-icons [icon]="'alert-circle'" />About</a></li>
              <li class="nav-item"><a class="nav-link" role="tab" [ngClass]="{'active show': openTab === 'friends'}" (click)="tabbed('friends')"><app-feather-icons [icon]="'users'" />Friends</a></li>
              <li class="nav-item"><a class="nav-link" role="tab" [ngClass]="{'active show': openTab === 'photos'}" (click)="tabbed('photos')"><app-feather-icons [icon]="'image'" />Photos</a></li>
            </ul>
            <div class="input-group">
              <input class="form-control" type="text" placeholder="Search......."><span class="input-group-text"> <i class="fa fa-search"></i></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="tab-content" id="top-tabContent">
      <div class="tab-pane fade show active" [ngClass]="{'show active': openTab === 'timeline'}">
       <app-time-line />
      </div>
      <div class="tab-pane fade" [ngClass]="{'show active': openTab === 'about'}">
       <app-about />
      </div>
      <div class="tab-pane fade" [ngClass]="{'show active': openTab === 'friends'}">
       <app-friends />
      </div>
      <div class="tab-pane fade" [ngClass]="{'show active': openTab === 'photos'}">
        <app-photos />
      </div>
    </div>
  </div>
</div>
