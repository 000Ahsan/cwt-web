<div class="container-fluid">
    <div class="page-title">
        <div class="row">
            <div class="col-6">
                <h3>My Daily History</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-12" *ngFor="let log of history">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="mb-0 text-primary">{{ log.projectName }}</h5>
                        <span class="badge bg-light text-dark">{{ log.date | date:'mediumDate' }}</span>
                    </div>
                    <p class="mb-2">{{ log.description }}</p>
                    <div class="row g-2 mt-2" *ngIf="log.photos && log.photos.length > 0">
                        <div class="col-3" *ngFor="let photo of log.photos">
                            <img [src]="photo" class="img-fluid rounded shadow-sm"
                                style="height: 60px; width: 100%; object-fit: cover;">
                        </div>
                    </div>
                    <hr class="my-2">
                    <small class="text-muted">Session: {{ log.startTime | date:'shortTime' }} - {{ log.endTime |
                        date:'shortTime' }} ({{ calculateDuration(log.startTime, log.endTime) }})</small>
                </div>
            </div>
        </div>

        <div class="col-sm-12" *ngIf="history.length === 0">
            <div class="card text-center py-5">
                <div class="card-body">
                    <i class="fa fa-history fa-3x text-light mb-3"></i>
                    <p class="text-muted">No work history found yet.</p>
                </div>
            </div>
        </div>
    </div>
</div>
