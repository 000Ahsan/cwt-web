<div class="container-fluid">
  <div class="row">
    <div
      class="col-xl-5 b-center bg-size"
      style=" background-image: url('assets/images/login/3.jpg'); background-size: cover; background-position: center center; display: block;">
      <img class="bg-img-cover bg-center" src="assets/images/login/3.jpg" alt="looginpage" style="display: none"/>
    </div>
    <div class="col-xl-7 p-0">
      <div class="login-card">
        <form class="theme-form login-form">
          <h4>Login</h4>
          <h6>Welcome back! Log in to your account.</h6>
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="icon-email"></i></span>
              <input class="form-control" type="email" required="" placeholder="Test@gmail.com"/>
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="icon-lock"></i></span>
              <input class="form-control" [type]="show ? 'text' : 'password'" name="login[password]" required="" placeholder="*********"/>
              @if (show) {
                <div class="show-hide" (click)="showPassword()"><span class="Hide"></span></div>
                } @else {
                <div class="show-hide" (click)="showPassword()"><span class="show"></span></div>
                }
            </div>
          </div>
          <div class="form-group">
            <div class="checkbox">
              <input id="checkbox1" type="checkbox" />
              <label class="text-muted" for="checkbox1">Remember password</label>
            </div>
            <a class="link" href="/authentication/forgot-password">Forgot password?</a>
          </div>
          <div class="form-group">
            <a class="btn btn-primary btn-block" href="/" type="submit">Sign in</a>
          </div>
          <div class="login-social-title">
            <h5>Sign in with</h5>
          </div>
          <div class="form-group">
            <ul class="login-social">
              <li>
                <a href="https://www.linkedin.com" target="_blank"><app-feather-icons [icon]="'linkedin'" /></a>
              </li>
              <li>
                <a href="https://twitter.com" target="_blank"><app-feather-icons [icon]="'twitter'" /></a>
              </li>
              <li>
                <a href="https://www.facebook.com" target="_blank"><app-feather-icons [icon]="'facebook'" /></a>
              </li>
              <li>
                <a href="https://www.instagram.com" target="_blank"><app-feather-icons [icon]="'instagram'" /></a>
              </li>
            </ul>
          </div>
          <p>
            Don't have account?<a
              class="ms-2"
              href="/authentication/register/register-simple"
              >Create Account</a
            >
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
