<div class="container-fluid">
    <div class="page-title">
        <div class="row">
            <div class="col-6">
                <h3>{{ reportTitle }}</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-12">
            <div class="card shadow-sm">
                <div class="card-header pb-0">
                    <h5>{{ reportTitle }} Detailed View</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Worker</th>
                                    <th>Project</th>
                                    <th>Work Description</th>
                                    <th>Hours</th>
                                    <th>Photos</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let item of reportData">
                                    <td>{{ item.workerName }}</td>
                                    <td>{{ item.projectName }}</td>
                                    <td>{{ item.description }}</td>
                                    <td>{{ item.duration }}h</td>
                                    <td>
                                        <div class="d-flex gap-1" *ngIf="item.photos?.length">
                                            <img *ngFor="let p of item.photos" [src]="p" class="rounded"
                                                style="width: 30px; height: 30px; object-fit: cover;">
                                        </div>
                                        <span class="text-muted" *ngIf="!item.photos?.length">No photos</span>
                                    </td>
                                </tr>
                                <tr *ngIf="reportData.length === 0">
                                    <td colspan="5" class="text-center py-4 text-muted">No data available for this
                                        period.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
