<div class="container-fluid">
    <div class="page-title">
        <div class="row justify-content-between align-items-center mb-3 mt-3">
            <div class="col-md-6 col-sm-12">
                <app-breadcrumb />
            </div>
            <div class="col-md-6 col-sm-12 text-end">
                <button class="btn btn-primary" (click)="showCreateModal = true">Create New Project</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-12">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Project Name</th>
                                    <th>Status</th>
                                    <th>Workers Assigned</th>
                                    <th>Created At</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let project of projects">
                                    <td>{{ project.name }}</td>
                                    <td>
                                        <span class="badge"
                                            [ngClass]="project.isActive ? 'bg-success' : 'bg-secondary'">
                                            {{ project.active ? 'Active' : 'Archived' }}
                                        </span>
                                    </td>
                                    <td>{{ project.workerCount || 0 }}</td>
                                    <td>{{ project.createdAt | date }}</td>
                                    <td>
                                        <button class="btn btn-sm btn-info me-2">Edit</button>
                                        <button class="btn btn-sm btn-outline-primary">Assign Worker</button>
                                    </td>
                                </tr>
                                <tr *ngIf="projects.length === 0">
                                    <td colspan="5" class="text-center">No projects found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Simple Overlay for Create Modal (Mock) -->
<div class="modal fade show" *ngIf="showCreateModal" style="display: block; background: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Project</h5>
                <button type="button" class="btn-close" (click)="showCreateModal = false"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Project Name</label>
                    <input type="text" class="form-control" [(ngModel)]="newProject.name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" [(ngModel)]="newProject.description"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="showCreateModal = false">Cancel</button>
                <button type="button" class="btn btn-primary" (click)="saveProject()">Save Project</button>
            </div>
        </div>
    </div>
</div>
