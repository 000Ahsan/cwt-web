<div class="container-fluid">
    <div class="page-title">
        <div class="row justify-content-between align-items-center mb-3 mt-3">
            <div class="col-md-6 col-sm-12">
                <app-breadcrumb />
            </div>
            <div class="col-md-6 col-sm-12 text-end">
                <button class="btn btn-primary" (click)="showCreateModal = true">Add New Worker</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xl-4 col-md-6" *ngFor="let worker of workers">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3 justify-content-between">
                        <div class="d-flex align-items-center">
                            <img class="img-40 rounded-circle me-3" src="assets/images/user/7.jpg" alt="">
                            <div>
                                <h5 class="mb-0">{{ worker.name }}</h5>
                                <p class="mb-0 text-muted small">{{ worker.email }}</p>
                            </div>
                        </div>
                        <button class="btn btn-sm btn-outline-info" (click)="editWorker(worker)">Edit</button>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-muted">Active Assignments</label>
                        <div class="d-flex flex-wrap gap-1">
                            <span class="badge bg-primary" *ngFor="let p of worker.assignments">{{ p.project.name
                                }}</span>
                            <span class="text-muted small" *ngIf="!worker.assignments?.length">No active projects</span>
                        </div>
                    </div>

                    <div class="mt-auto pt-3 border-top">
                        <label class="form-label small text-muted">Assign to Project</label>
                        <div class="input-group">
                            <select class="form-select form-select-sm" [(ngModel)]="worker.selectedProjectId">
                                <option value="">Select project...</option>
                                <option *ngFor="let p of projects" [value]="p.id">{{ p.name }}</option>
                            </select>
                            <button class="btn btn-sm btn-primary" [disabled]="!worker.selectedProjectId"
                                (click)="assignWorker(worker)">
                                Assign
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 text-center py-5" *ngIf="workers.length === 0">
            <div class="text-muted">
                <i class="fa fa-users fa-3x mb-3"></i>
                <h5>No workers found</h5>
                <p>Click "Add New Worker" to get started</p>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Worker Modal -->
<div class="modal fade show" *ngIf="showCreateModal" style="display: block; background: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">{{ editingWorker ? 'Update' : 'Add New' }} Worker</h5>
                <button type="button" class="btn-close btn-close-white" (click)="closeModal()"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" [(ngModel)]="newWorker.email"
                        placeholder="email@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" [(ngModel)]="newWorker.name" placeholder="John Doe">
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ editingWorker ? 'New Password (leave blank to keep current)' :
                        'Password' }}</label>
                    <input type="password" class="form-control" [(ngModel)]="newWorker.password">
                </div>
            </div>
            <div class="modal-footer border-top-0">
                <button type="button" class="btn btn-link text-muted" (click)="closeModal()">Cancel</button>
                <button type="button" class="btn btn-primary px-4" (click)="saveWorker()">
                    {{ editingWorker ? 'Update Worker' : 'Create Worker' }}
                </button>
            </div>
        </div>
    </div>
</div>
