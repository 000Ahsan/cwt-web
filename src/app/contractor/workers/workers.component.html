<div class="container-fluid">
    <div class="page-title">
        <div class="row">
            <div class="col-6">
                <h3>Worker Assignments</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-xl-4 col-md-6" *ngFor="let worker of workers">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="media align-items-center mb-3">
                        <img class="img-40 rounded-circle me-3" src="assets/images/user/7.jpg" alt="">
                        <div class="media-body">
                            <h5 class="mb-0">{{ worker.firstName }} {{ worker.lastName }}</h5>
                            <p class="mb-0 text-muted">{{ worker.email }}</p>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-muted">Active Assignments</label>
                        <div class="d-flex flex-wrap gap-1">
                            <span class="badge bg-primary" *ngFor="let p of worker.assignedProjects">{{ p.name }}</span>
                            <span class="text-muted small" *ngIf="!worker.assignedProjects?.length">No active
                                projects</span>
                        </div>
                    </div>

                    <div class="mt-3">
                        <select class="form-select form-select-sm mb-2" [(ngModel)]="worker.selectedProjectId">
                            <option [ngValue]="undefined">Assign new project...</option>
                            <option *ngFor="let p of projects" [ngValue]="p.id">{{ p.name }}</option>
                        </select>
                        <button class="btn btn-sm btn-outline-primary w-100" [disabled]="!worker.selectedProjectId"
                            (click)="assignWorker(worker)">
                            Assign Project
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
