<div class="container-fluid dashboard-default-sec">
    <div class="page-title">
        <div class="row justify-content-between align-items-center mb-3 mt-3">
            <div class="col-md-6 col-sm-12">
                <app-breadcrumb />
            </div>
            <div class="col-md-6 col-sm-12 text-end">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xl-5 box-col-12 des-xl-100">
            <div class="row">
                <div class="col-xl-12 col-md-6 box-col-6 des-xl-50">
                    <div class="card profile-greeting">
                        <div class="card-header">
                            <div class="header-top">
                                <div class="setting-list bg-primary position-unset">
                                    <ul class="list-unstyled setting-option">
                                        <li>
                                            <div class="setting-white">
                                                <i class="icon-settings"></i>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                        <div class="card-body text-center p-t-0">
                            <h3 class="font-light">Welcome Back, {{ user?.name }}!!</h3>
                            <p>Welcome to the CrewTrack Dashboard. We are glad to have you on board. On this dashboard
                                you can track your projects and workers.</p>
                            <button class="btn btn-light">Update</button>
                        </div>
                        <div class="confetti">
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                            <div class="confetti-piece"></div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-6 col-md-3 col-sm-6 box-col-3 des-xl-25 rate-sec">
                    <div class="card income-card card-primary">
                        <div class="card-body text-center">
                            <div class="round-box">
                                <app-feather-icons [icon]="'briefcase'" class="txt-primary" />
                            </div>
                            <h5>{{ stats?.projectsCount || 0 }}</h5>
                            <p>Total Projects</p>
                            <div class="parrten">
                                <svg-icon src="assets/images/svg/dashboard/beg.svg" [svgStyle]="{ 'width.px':90 }" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-6 col-md-3 col-sm-6 box-col-3 des-xl-25 rate-sec">
                    <div class="card income-card card-secondary">
                        <div class="card-body text-center">
                            <div class="round-box">
                                <app-feather-icons [icon]="'users'" class="txt-secondary" />
                            </div>
                            <h5>{{ stats?.workersCount || 0 }}</h5>
                            <p>Total Workers</p>
                            <div class="parrten">
                                <svg-icon src="assets/images/svg/dashboard/parrten.svg"
                                    [svgStyle]="{ 'width.px':90 }" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-xl-7 box-col-12 des-xl-100 dashboard-sec">
            <div class="card income-card">
                <div class="card-header">
                    <div class="header-top d-sm-flex align-items-center">
                        <h5>Sales overview</h5>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div id="chart-timeline-dashbord">
                        <apx-chart [chart]="sales.chart" [dataLabels]="sales.dataLabels" [series]="sales.series"
                            [colors]="sales.colors" [xaxis]="sales.xaxis" [tooltip]="sales.tooltip"
                            [markers]="sales.markers" [annotations]="sales.annotations"
                            [responsive]="sales.responsive" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
