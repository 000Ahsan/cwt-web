<div class="container-fluid p-0">
  <div class="row m-0">
    <div class="col-12 p-0">
      <div class="login-card">
        <form class="theme-form login-form" [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="text-center mb-4">
            <img src="/assets/images/logo/logo.png" class="logo">
            <p class="text-muted">Enter your credentials to access your account.</p>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger mb-3">
            {{ errorMessage }}
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><app-feather-icons [icon]="'mail'"></app-feather-icons></span>
              <input class="form-control" type="email" placeholder="email@example.com" formControlName="email" />
            </div>
            <div *ngIf="loginForm.controls['email'].touched && loginForm.controls['email'].errors?.['required']"
              class="text text-danger mt-1">Email is required</div>
            <div *ngIf="loginForm.controls['email'].touched && loginForm.controls['email'].errors?.['email']"
              class="text text-danger mt-1">Invalid Email</div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="input-group">
              <span class="input-group-text"><app-feather-icons [icon]="'lock'"></app-feather-icons></span>
              <input class="form-control" [type]="show ? 'text' : 'password'" formControlName="password"
                placeholder="*********" />
              <div class="show-hide" (click)="showPassword()">
                <span [class.show]="!show" [class.Hide]="show"></span>
              </div>
            </div>
            <div *ngIf="loginForm.controls['password'].touched && loginForm.controls['password'].errors?.['required']"
              class="text text-danger mt-1">Password is required</div>
          </div>

          <div class="form-group mt-4">
            <button class="btn btn-primary btn-block w-100" [disabled]="loginForm.invalid || loading" type="submit">
              <span *ngIf="loading">Signing in...</span>
              <span *ngIf="!loading">Sign In</span>
            </button>
          </div>

          <div class="mt-4 text-center">
            <p class="mb-0 text-muted">Field operations simplified.</p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
